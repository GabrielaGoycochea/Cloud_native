spring.datasource.url=jdbc:postgresql://postgres-db:5432/eventos_db
spring.datasource.username=postgres
spring.datasource.password=secretpostgres
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración AWS S3
spring.cloud.aws.region.static=us-east-1
aws.s3.bucket=bkt-cl0udn4tive-s2

# Configuración EFS
efs.path=/app/efs

#Logs web
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# Configuración de seguridad S5

spring.security.oauth2.resourceserver.jwt.issuer-uri=VALOR_DE_iss
spring.security.oauth2.resourceserver.jwt.audiences=VALOR_DE_aud
